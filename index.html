<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银河奶牛放置人才市场</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
        }
        
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }
        
        iframe.loaded {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .retry-btn {
            margin-top: 15px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        .retry-btn:hover {
            background: #5a6fd8;
        }
        
        .status {
            margin: 10px 0;
            padding: 8px;
            border-radius: 5px;
            font-size: 14px;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .warning {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2>🚀 银河奶牛放置人才市场</h2>
        <p>正在连接服务器...</p>
        <div class="status">使用HTTP连接加载中</div>
        <div class="warning">
            ⚠️ 浏览器可能显示"混合内容"警告，这是正常的。<br>
            点击地址栏的盾牌图标，选择"加载不安全脚本"即可正常使用。
        </div>
    </div>
    
    <iframe 
        id="mainFrame" 
        src="http://115.159.67.54:3030/" 
        onload="frameLoaded()"
        onerror="frameError()">
    </iframe>
    
    <script>
        var loadTimeout;
        var retryCount = 0;
        var maxRetries = 3;
        
        function updateStatus(message) {
            var statusEl = document.querySelector('.status');
            if (statusEl) {
                statusEl.textContent = message;
            }
        }
        
        function frameLoaded() {
            clearTimeout(loadTimeout);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainFrame').classList.add('loaded');
            console.log('HTTP页面加载成功');
        }
        
        function frameError() {
            clearTimeout(loadTimeout);
            retryCount++;
            
            if (retryCount <= maxRetries) {
                document.getElementById('loading').innerHTML = 
                    '<div class="spinner"></div>' +
                    '<h2>🔄 连接重试中</h2>' +
                    '<p>第 ' + retryCount + ' 次尝试连接服务器...</p>' +
                    '<div class="status">正在重新连接HTTP服务器</div>';
                
                setTimeout(function() {
                    document.getElementById('mainFrame').src = 'http://115.159.67.54:3030/?retry=' + retryCount;
                }, 2000);
            } else {
                document.getElementById('loading').innerHTML = 
                    '<h2>❌ 连接服务器失败</h2>' +
                    '<p>可能的原因：</p>' +
                    '<ul style="text-align: left; display: inline-block; margin: 15px 0;">' +
                    '<li>服务器未启动或无法访问</li>' +
                    '<li>网络连接问题</li>' +
                    '<li>浏览器阻止了混合内容</li>' +
                    '</ul>' +
                    '<div style="margin: 20px 0;">' +
                    '<button class="retry-btn" onclick="enableMixedContent()" style="background: #28a745;">' +
                    '🛡️ 启用混合内容' +
                    '</button>' +
                    '<button class="retry-btn" onclick="openDirect()" style="background: #17a2b8;">' +
                    '🔗 直接访问服务器' +
                    '</button>' +
                    '<button class="retry-btn" onclick="location.reload()">' +
                    '🔄 重新加载' +
                    '</button>' +
                    '</div>';
            }
        }
        
        function enableMixedContent() {
            document.getElementById('loading').innerHTML = 
                '<h2>🛡️ 启用混合内容</h2>' +
                '<p>请按以下步骤操作：</p>' +
                '<ol style="text-align: left; display: inline-block; margin: 15px 0;">' +
                '<li>点击浏览器地址栏右侧的盾牌图标 🛡️</li>' +
                '<li>选择"加载不安全脚本"或"允许混合内容"</li>' +
                '<li>页面将自动刷新并正常显示</li>' +
                '</ol>' +
                '<div class="warning">' +
                '如果没有看到盾牌图标，请尝试刷新页面或使用其他浏览器' +
                '</div>' +
                '<button class="retry-btn" onclick="location.reload()">' +
                '✅ 已启用，重新加载' +
                '</button>';
        }
        
        function openDirect() {
            window.open('http://115.159.67.54:3030/', '_blank');
            
            document.getElementById('loading').innerHTML = 
                '<h2>🔗 已在新标签页打开</h2>' +
                '<p>如果新标签页正常显示，说明服务器运行正常。</p>' +
                '<p>请返回此页面并启用混合内容以在当前页面使用。</p>' +
                '<button class="retry-btn" onclick="enableMixedContent()" style="background: #28a745;">' +
                '🛡️ 启用混合内容' +
                '</button>';
        }
        
        // 检测混合内容阻止
        function detectMixedContentBlock() {
            var testImg = new Image();
            testImg.onload = function() {
                console.log('混合内容未被阻止');
            };
            testImg.onerror = function() {
                console.log('检测到混合内容阻止');
                setTimeout(function() {
                    if (!document.getElementById('mainFrame').classList.contains('loaded')) {
                        updateStatus('检测到混合内容阻止，请启用');
                        frameError();
                    }
                }, 5000);
            };
            testImg.src = 'http://115.159.67.54:3030/favicon.ico?' + Date.now();
        }
        
        // 设置加载超时
        loadTimeout = setTimeout(function() {
            if (!document.getElementById('mainFrame').classList.contains('loaded')) {
                updateStatus('连接超时，正在重试...');
                frameError();
            }
        }, 8000);
        
        // 页面加载后检测混合内容
        setTimeout(detectMixedContentBlock, 2000);
        
        // 页面可见性变化时重新尝试连接
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && retryCount > 0 && retryCount <= maxRetries) {
                location.reload();
            }
        });
    </script>
</body>
</html>
