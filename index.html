<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银河奶牛放置人才市场</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }
        
        #content {
            width: 100%;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>🚀 正在加载银河奶牛放置人才市场...</h2>
        <p>请稍候</p>
    </div>
    
    <div id="content"></div>
    
    <script>
        async function loadContent() {
            try {
                // 使用代理服务或直接请求
                const response = await fetch('http://115.159.67.54:3030/');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                let html = await response.text();
                
                // 修复相对路径问题
                html = html.replace(
                    /(src|href)=["'](?!http|\/\/|data:)([^"']*?)["']/gi,
                    '$1="http://115.159.67.54:3030/$2"'
                );
                
                // 注入基础URL
                html = html.replace(
                    '<head>',
                    '<head><base href="http://115.159.67.54:3030/">'
                );
                
                document.getElementById('content').innerHTML = html;
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('loading').innerHTML = 
                    `<h2>❌ 加载失败</h2>
                     <p>错误: ${error.message}</p>
                     <p>请检查服务器是否正常运行</p>
                     <button onclick="location.reload()">重试</button>`;
            }
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', loadContent);
    </script>
</body>
</html>
