<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银河奶牛放置人才市场</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
        }
        
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }
        
        iframe.loaded {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .retry-btn {
            margin-top: 15px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        .retry-btn:hover {
            background: #5a6fd8;
        }
        
        .status {
            margin: 10px 0;
            padding: 8px;
            border-radius: 5px;
            font-size: 14px;
            background: #e3f2fd;
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2>🚀 银河奶牛放置人才市场</h2>
        <p>正在连接HTTPS服务器...</p>
        <div class="status">使用安全连接加载中</div>
    </div>
    
    <iframe 
        id="mainFrame" 
        src="https://115.159.67.54:3443/" 
        onload="frameLoaded()"
        onerror="frameError()">
    </iframe>
    
    <script>
        var loadTimeout;
        var retryCount = 0;
        var maxRetries = 3;
        
        function updateStatus(message) {
            var statusEl = document.querySelector('.status');
            if (statusEl) {
                statusEl.textContent = message;
            }
        }
        
        function frameLoaded() {
            clearTimeout(loadTimeout);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainFrame').classList.add('loaded');
            console.log('HTTPS页面加载成功');
        }
        
        function frameError() {
            clearTimeout(loadTimeout);
            retryCount++;
            
            if (retryCount <= maxRetries) {
                document.getElementById('loading')。innerHTML = 
                    '<div class="spinner"></div>' +
                    '<h2>🔄 连接重试中</h2>' +
                    '<p>第 ' + retryCount + ' 次尝试连接HTTPS服务器...</p>' +
                    '<div class="status">如果是自签名证书，浏览器可能显示安全警告</div>';
                
                setTimeout(function() {
                    document。getElementById('mainFrame')。src = 'https://115.159.67.54:3443/?retry=' + retryCount;
                }, 2000);
            } else {
                document。getElementById('loading')。innerHTML = 
                    '<h2>⚠️ 连接HTTPS服务器失败</h2>' +
                    '<p>可能的原因：</p>' +
                    '<ul style="text-align: left; display: inline-block; margin: 15px 0;">' +
                    '<li>浏览器阻止了自签名证书</li>' +
                    '<li>防火墙未开放3443端口</li>' +
                    '<li>HTTPS服务器未正常运行</li>' +
                    '</ul>' +
                    '<div style="margin: 20px 0;">' +
                    '<button class="retry-btn" onclick="trustCertificate()" style="background: #28a745;">' +
                    '🔒 信任证书并访问' +
                    '</button>' +
                    '<button class="retry-btn" onclick="useHttp()" style="background: #ffc107; color: #000;">' +
                    '🌐 使用HTTP版本' +
                    '</button>' +
                    '<button class="retry-btn" onclick="location.reload()">' +
                    '🔄 重新加载' +
                    '</button>' +
                    '</div>';
            }
        }
        
        function trustCertificate() {
            window。open('https://115.159.67.54:3443/'， '_blank');
            
            document.getElementById('loading').innerHTML = 
                '<h2>🔒 请在新标签页中信任证书</h2>' +
                '<p>步骤：</p>' +
                '<ol style="text-align: left; display: inline-block; margin: 15px 0;">' +
                '<li>在新打开的标签页中点击"高级"</li>' +
                '<li>点击"继续前往 115.159.67.54（不安全）"</li>' +
                '<li>信任证书后，回到此页面点击下方按钮</li>' +
                '</ol>' +
                '<button class="retry-btn" onclick="location.reload()">' +
                '✅ 已信任证书，重新加载' +
                '</button>';
        }
        
        function useHttp() {
            document.getElementById('loading').innerHTML = 
                '<div class="spinner"></div>' +
                '<h2>🌐 切换到HTTP连接</h2>' +
                '<p>正在加载HTTP版本...</p>' +
                '<div class="status">注意：HTTP连接不加密，安全性较低</div>';
            
            document。getElementById('mainFrame')。src = 'http://115.159.67.54:3030/';
        }
        
        loadTimeout = setTimeout(function() {
            if (!document。getElementById('mainFrame')。classList.contains('loaded')) {
                updateStatus('连接超时，正在重试...');
                frameError();
            }
        }， 10000);
        
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && retryCount > 0 && retryCount <= maxRetries) {
                location。reload();
            }
        });
    </script>
</body>
</html>
